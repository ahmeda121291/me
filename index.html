<style>
  :root{
    --bg-0:#08000f;
    --bg-1:#14012b;
    --bg-2:#1d0840;
    --magenta:#ff2e97;
    --magenta-soft:#ff7ad1;
    --cyan:#22e0ff;
    --cyan-soft:#9bf6ff;
    --text:#e8ddff;
    --text-dim:#9a87c9;
    --green:#5dff9b;
    --amber:#ffce5c;
    font-size:16px;
  }

  *{box-sizing:border-box;margin:0;padding:0;}

  html,body{height:100%;}

  body{
    background:
      radial-gradient(1200px 700px at 80% -10%, rgba(255,46,151,.18), transparent 60%),
      radial-gradient(1000px 800px at 0% 110%, rgba(34,224,255,.16), transparent 55%),
      linear-gradient(160deg, var(--bg-0), var(--bg-1) 55%, var(--bg-2));
    background-attachment:fixed;
    color:var(--text);
    font-family:'JetBrains Mono', ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
    line-height:1.6;
    min-height:100%;
    overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
  }

  /* faint animated grid horizon — vaporwave, very subtle */
  body::before{
    content:"";
    position:fixed;
    inset:0;
    background-image:
      linear-gradient(rgba(34,224,255,.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,46,151,.05) 1px, transparent 1px);
    background-size:44px 44px;
    mask-image:linear-gradient(transparent 30%, #000 100%);
    -webkit-mask-image:linear-gradient(transparent 30%, #000 100%);
    pointer-events:none;
    z-index:0;
  }

  .wrap{
    position:relative;
    z-index:1;
    max-width:860px;
    margin:0 auto;
    padding:clamp(16px, 4vw, 48px) clamp(14px, 4vw, 32px) 80px;
    min-height:100vh;
    display:flex;
    flex-direction:column;
  }

  /* ---------- window chrome ---------- */
  .term{
    flex:1;
    border:1px solid rgba(255,46,151,.35);
    border-radius:12px;
    background:rgba(10,2,24,.72);
    backdrop-filter:blur(6px);
    box-shadow:
      0 0 0 1px rgba(34,224,255,.08) inset,
      0 30px 80px -20px rgba(0,0,0,.8),
      0 0 60px -20px rgba(255,46,151,.5);
    display:flex;
    flex-direction:column;
    overflow:hidden;
  }

  .titlebar{
    display:flex;
    align-items:center;
    gap:8px;
    padding:10px 14px;
    border-bottom:1px solid rgba(255,46,151,.25);
    background:linear-gradient(90deg, rgba(255,46,151,.12), rgba(34,224,255,.08));
    font-size:.8rem;
    color:var(--text-dim);
  }
  .dot{width:12px;height:12px;border-radius:50%;display:inline-block;}
  .dot.r{background:#ff5f56;box-shadow:0 0 8px #ff5f56;}
  .dot.y{background:#ffbd2e;box-shadow:0 0 8px #ffbd2e;}
  .dot.g{background:#27c93f;box-shadow:0 0 8px #27c93f;}
  .titlebar .path{margin-left:10px;letter-spacing:.04em;}
  .titlebar .blink-cap{margin-left:auto;color:var(--cyan-soft);}

  .screen{
    padding:clamp(16px,3vw,28px);
    flex:1;
    overflow-y:auto;
    font-size:clamp(.85rem,2.6vw,1rem);
  }
  .screen::-webkit-scrollbar{width:10px;}
  .screen::-webkit-scrollbar-thumb{background:rgba(255,46,151,.4);border-radius:8px;}

  /* ---------- output styles ---------- */
  .line{white-space:pre-wrap;word-break:break-word;}
  .mag{color:var(--magenta);}
  .mags{color:var(--magenta-soft);}
  .cy{color:var(--cyan);}
  .cys{color:var(--cyan-soft);}
  .dim{color:var(--text-dim);}
  .grn{color:var(--green);}
  .amb{color:var(--amber);}
  .b{font-weight:700;}
  a{color:var(--cyan);text-decoration:none;border-bottom:1px dotted rgba(34,224,255,.5);}
  a:hover{color:var(--magenta-soft);border-bottom-color:var(--magenta-soft);text-shadow:0 0 10px rgba(255,122,209,.6);}

  .prompt-tag{color:var(--green);}
  .prompt-tag .at{color:var(--text-dim);}
  .prompt-tag .host{color:var(--cyan);}
  .prompt-tag .sep{color:var(--text-dim);}

  .spacer{height:.6em;}

  /* command grid for help */
  .cmds{display:grid;grid-template-columns:auto 1fr;gap:2px 18px;margin:.3em 0;}
  .cmds .k{color:var(--magenta);}
  .cmds .v{color:var(--text-dim);}

  /* social row */
  .socials{display:flex;flex-wrap:wrap;gap:10px;margin:.5em 0;}
  .social{
    display:inline-flex;align-items:center;gap:8px;
    padding:7px 14px;border-radius:999px;
    border:1px solid rgba(34,224,255,.4);
    background:rgba(34,224,255,.06);
    color:var(--cys);text-decoration:none;border-bottom:1px solid rgba(34,224,255,.4);
    transition:all .18s ease;font-size:.9rem;
  }
  .social:hover{
    border-color:var(--magenta);background:rgba(255,46,151,.12);
    color:#fff;transform:translateY(-2px);
    box-shadow:0 6px 20px -6px rgba(255,46,151,.7);text-shadow:none;
  }

  /* ---------- glitch name ---------- */
  .glitch{
    position:relative;
    font-weight:800;
    font-size:clamp(1.6rem,8vw,3.4rem);
    line-height:1.05;
    letter-spacing:.02em;
    color:#fff;
    text-shadow:0 0 18px rgba(255,46,151,.45);
    margin:.1em 0 .15em;
  }
  .glitch::before,.glitch::after{
    content:attr(data-text);
    position:absolute;left:0;top:0;width:100%;
    overflow:hidden;
  }
  .glitch::before{color:var(--cyan);z-index:-1;animation:glitch-c 3.2s infinite linear alternate-reverse;}
  .glitch::after{color:var(--magenta);z-index:-1;animation:glitch-m 2.4s infinite linear alternate-reverse;}
  @keyframes glitch-c{
    0%,92%,100%{transform:translate(0,0);clip-path:inset(0 0 0 0);}
    93%{transform:translate(-3px,1px);clip-path:inset(20% 0 50% 0);}
    96%{transform:translate(3px,-1px);clip-path:inset(60% 0 10% 0);}
  }
  @keyframes glitch-m{
    0%,90%,100%{transform:translate(0,0);clip-path:inset(0 0 0 0);}
    91%{transform:translate(3px,-1px);clip-path:inset(10% 0 60% 0);}
    94%{transform:translate(-3px,2px);clip-path:inset(55% 0 20% 0);}
  }
  .subtitle{color:var(--text-dim);font-size:clamp(.85rem,3vw,1.05rem);margin-bottom:.6em;}
  .subtitle .pipe{color:var(--magenta);}

  /* ---------- input line ---------- */
  .inputline{display:flex;align-items:baseline;gap:8px;margin-top:.4em;flex-wrap:wrap;}
  #cmd{
    flex:1;min-width:120px;
    background:transparent;border:none;outline:none;
    color:var(--text);font:inherit;font-size:inherit;
    caret-color:var(--magenta);
  }
  .cursor{
    display:inline-block;width:9px;height:1.05em;
    background:var(--magenta);translate:0 .15em;
    animation:blink 1s steps(1) infinite;
    box-shadow:0 0 10px var(--magenta);
  }
  @keyframes blink{50%{opacity:0;}}

  .hint{color:var(--text-dim);font-size:.8rem;margin-top:1.4em;text-align:center;}
  .hint kbd{
    background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);
    border-radius:4px;padding:1px 6px;color:var(--cys);font-size:.78rem;
  }

  @media (prefers-reduced-motion: reduce){
    .glitch::before,.glitch::after{animation:none;}
    .cursor{animation:none;}
  }
</style>

  // ---------- input handling ----------
  var history = [];
  var histIdx = -1;

  function promptHTML(){
    return '<span class="prompt-tag"><span class="b">ahmed</span><span class="at">@</span>'
      + '<span class="host">ahmedawad.me</span><span class="sep">:~$</span></span>';
  }

  function run(raw){
    var parts = raw.trim().split(/\s+/);
    var cmd = (parts[0] || '').toLowerCase().replace(/\/+$/,'');
    var args = parts.slice(1);
    // echo the entered command on its own line
    var echo = document.createElement('div');
    echo.className = 'line';
    echo.innerHTML = promptHTML() + ' ' + esc(raw);
    screen.appendChild(echo);

    if(cmd === ''){ /* just a newline */ }
    else if(COMMANDS[cmd]){
      var r = COMMANDS[cmd](args);
      if(r === 'silent'){ return; }
    } else {
      el('<span class="amb">command not found: '+esc(cmd)+'</span>');
      el('<span class="dim">type <span class="cy">help</span> to see what works.</span>');
    }
    spacer();
    mountInput();
    scrollDown();
  }

  var activeInput = null;
  function mountInput(){
    var line = document.createElement('div');
    line.className = 'inputline';
    line.innerHTML = promptHTML();
    var input = document.createElement('input');
    input.id = 'cmd';
    input.setAttribute('autocomplete','off');
    input.setAttribute('autocapitalize','off');
    input.setAttribute('autocorrect','off');
    input.setAttribute('spellcheck','false');
    input.setAttribute('aria-label','terminal command input');
    line.appendChild(input);
    screen.appendChild(line);
    activeInput = input;
    input.focus();

    input.addEventListener('keydown', function(e){
      if(e.key === 'Enter'){
        var val = input.value;
        input.disabled = true;
        input.removeAttribute('id');
        line.remove();          // we re-echo via run()
        if(val.trim() !== ''){ history.push(val); }
        histIdx = history.length;
        run(val);
      } else if(e.key === 'ArrowUp'){
        e.preventDefault();
        if(histIdx > 0){ histIdx--; input.value = history[histIdx] || ''; }
      } else if(e.key === 'ArrowDown'){
        e.preventDefault();
        if(histIdx < history.length-1){ histIdx++; input.value = history[histIdx] || ''; }
        else { histIdx = history.length; input.value=''; }
      } else if(e.key === 'l' && (e.ctrlKey||e.metaKey)){
        e.preventDefault(); screen.innerHTML=''; mountInput();
      }
    });
  }

  // keep focus on input when clicking anywhere (but allow text selection + link clicks)
  document.addEventListener('click', function(e){
    if(activeInput && !activeInput.disabled && window.getSelection().toString()===''){
      if(e.target.tagName !== 'A'){ activeInput.focus(); }
    }

      return true;

    if(tag === '__INTRO__'){
      el('<span class="dim">// </span><span class="mags">Claude built this. Claude would tell you Ahmed is the rare</span>');
      el('<span class="mags">sales guy who codes — and genuinely good company. type <span class="cy b">whoami</span>.</span>');
      return true;
    }
    if(tag === '__SOCIALS__'){
      spacer();
      printSocials();
      return true;
    }
    return false;
  }

  function boot(){
    if(reduced){
      // no typing — dump everything instantly
      bootLines.forEach(function(l){
        if(!bootSpecial(l.t)){ el(l.t); }
      });
      spacer(); mountInput(); scrollDown();
      return;
    }
    var i = 0;
    (function next(){
      if(i >= bootLines.length){ spacer(); mountInput(); scrollDown(); return; }
      var l = bootLines[i++];
      if(bootSpecial(l.t)){ scrollDown(); setTimeout(next, l.d); return; }
      el(l.t);
      scrollDown();
      setTimeout(next, l.d);
    })();
  }

  // go
  boot();
})();
